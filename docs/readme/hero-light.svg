<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-label="Serendip. Zap through films like TV channels. One film per screen, a trailer already playing, picks from outside your usual loop. Building, Web, Open source, No LLM.">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Inter,'Segoe UI',Helvetica,Arial,sans-serif;fill:#14161D}.m{fill:#585E6D}.cap{font-size:11px;letter-spacing:.06em}.b{font-weight:600}</style>
<rect x="0.5" y="0.5" width="879" height="249" rx="12" fill="#FFFFFF" stroke="#DCDEE5"/>
<clipPath id="card"><rect x="0.5" y="0.5" width="879" height="249" rx="12"/></clipPath>
<defs><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffb547" stop-opacity=".22"/><stop offset="1" stop-color="#ffb547" stop-opacity="0"/></radialGradient></defs>
<g clip-path="url(#card)">
<circle cx="800" cy="125.0" r="170" fill="url(#glow)"/>
<rect x="687.0" y="12.0" width="226" height="226" rx="63.3" fill="#ffb547" fill-opacity="0.05" transform="rotate(12 800 125.0)"/>
<rect x="718.0" y="43.0" width="164" height="164" rx="45.9" fill="#ffb547" fill-opacity="0.08" transform="rotate(12 800 125.0)"/>
<rect x="748.0" y="73.0" width="104" height="104" rx="29.1" fill="#ffb547" fill-opacity="0.13" transform="rotate(12 800 125.0)"/>
<rect x="772" y="97.0" width="56" height="56" rx="16" fill="#ffb547" fill-opacity=".24" transform="rotate(12 800 125.0)"/>
</g>
<rect x="40" y="44" width="72" height="72" rx="16" fill="#ffb547"/>
<text x="76" y="92" font-size="34" text-anchor="middle" class="b" style="fill:#14161D">S</text>
<text class="b" x="136" y="76" font-size="40">Serendip</text>
<text x="136" y="112" font-size="19">Zap through films like TV channels.</text>
<text class="m" x="136" y="140" font-size="14">One film per screen, a trailer already playing, picks from outside your usual</text>
<text class="m" x="136" y="160" font-size="14">loop.</text>
<rect x="136.0" y="182" width="94.4" height="28" rx="14" fill="#3A4AA8" fill-opacity=".16"/>
<circle cx="151.0" cy="196" r="4" fill="#3A4AA8"/>
<text class="b" x="164.0" y="201" font-size="13" style="fill:#3A4AA8">Building</text>
<rect x="238.4" y="182" width="55.3" height="28" rx="14" fill="#F4F5F8" stroke="#DCDEE5"/>
<text class="m b" x="252.4" y="201" font-size="13">Web</text>
<rect x="301.7" y="182" width="106.6" height="28" rx="14" fill="#F4F5F8" stroke="#DCDEE5"/>
<text class="m b" x="315.7" y="201" font-size="13">Open source</text>
<rect x="416.3" y="182" width="79.5" height="28" rx="14" fill="#F4F5F8" stroke="#DCDEE5"/>
<text class="m b" x="430.3" y="201" font-size="13">No LLM</text>
</svg>
