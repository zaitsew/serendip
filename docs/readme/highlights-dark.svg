<svg xmlns="http://www.w3.org/2000/svg" width="880" height="284" viewBox="0 0 880 284" role="img" aria-label="Highlights. ZAPPING: One film per screen. Up and down to zap, left and right to change channel. TONIGHT: Only what streams in Spain. Picks come from your own services, with a one-line reason. OUTSIDE: Out of your usual loop. Every third pick leaves your usual genres and countries. TASTE: Bring your history. Import a Letterboxd export or a Netflix viewing history. DETOUR: Daily YouTube detours. Twelve videos a day from fields you rarely watch. AGENTS: JSON and MCP. Agents read tonight&#x27;s picks from an API or an MCP server.">
