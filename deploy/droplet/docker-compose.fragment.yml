# A fragment, not a stack. add-product.sh renders it to /srv/serendip/docker-compose.yml
# on the shared server and adds that path to the root /srv/docker-compose.yml's
# `include:` list, so the root file is never edited by hand.
#
# Caddy (on the external network `apps`) reaches this service by name. Nothing
# publishes a port to the host.
#
# Redeploy with scripts/deploy.sh. To do it by hand, use the ROOT stack, not this
# file on its own, so the container stays in the one compose project:
#   cd /srv && docker compose up -d --build serendip
#
# There is no scheduler container: the Detour refresh runs on the first open of the day, and the
# box has about 300 MB of RAM to spare.

services:
  serendip:
    # Built on the box from the bundle rsynced to ./app (see deploy/droplet/Dockerfile).
    build:
      context: ./app
      dockerfile: Dockerfile
    image: serendip-web:latest
    restart: unless-stopped
    # add-product.sh creates /srv/{{name}}/.env from deploy/droplet/.env.example. Put
    # SERENDIP_OWNER_KEY there (openssl rand -hex 24); the site refuses everyone without it.
    env_file:
      - /srv/{{name}}/.env
    environment:
      NODE_ENV: production
      PORT: "{{port}}"
      HOSTNAME: "0.0.0.0"
      # Caddy is the only thing that can reach this container: believe the last X-Forwarded-For hop.
      SERENDIP_TRUST_PROXY: "1"
      # The site is served over https, so the session cookie is Secure.
      SERENDIP_SECURE_COOKIE: "1"
      # Absolute URLs: redirects, and the Google OAuth redirect URI (<this>/api/youtube/callback).
      SERENDIP_PUBLIC_URL: https://{{name}}.{{domain}}
      # Where the SQLite file lives inside the container: the volume below.
      SERENDIP_DB: /data/serendip.db
      # NODE_OPTIONS (128 MB heap) comes from the Dockerfile.
    volumes:
      # The data volume: the database and its WAL files survive rebuilds. Owned by uid 1000
      # (the image's `node` user); scripts/deploy.sh fixes the owner on every run.
      - /srv/{{name}}/data:/data
    # The box is short on RAM (961 MB total, about 300 MB free, 12 containers). The heap is capped at
    # 128 MB by NODE_OPTIONS; 200 MB leaves room for the runtime. The Takeout import is parsed in the
    # browser for this reason (see docs/PRODUCT.md, S3).
    mem_limit: 200m
    cpus: 0.5
    networks:
      - apps
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:{{port}}/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  # Declared external: this fragment joins the network Caddy is on instead of making one.
  apps:
    external: true
