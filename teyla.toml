# teyla.toml — what must run without you, and what only you can confirm.

[product]
name = "serendip"
usage = "./check.sh usage"

[productize]
users = "owner"
target = "family"
platforms = ["web"]
primary = "web"                         # one web app: /tv in the Xiaomi Google TV browser, same page on the iPhone
identity = "shared-key"
tenancy = "single"                      # one owner, one SQLite file
backend = "local-mac"                   # S3 moves it to the droplet
llm = "none"                            # ranking and clustering are deterministic; no model anywhere
first_run = "sign-in"
sample_data = "labelled"                # no TMDB token: a banner says "Sample catalog — add TMDB_READ_TOKEN"; no YOUTUBE_API_KEY: Detour says "Sample — add YOUTUBE_API_KEY"
onboarding_doc = "docs/GETTING-STARTED.md"
secrets = ["SERENDIP_OWNER_KEY", "TMDB_READ_TOKEN", "YOUTUBE_API_KEY", "GOOGLE_OAUTH_CLIENT_ID", "GOOGLE_OAUTH_CLIENT_SECRET"]
cost_cap = ""

[productize.distribution]
web = "none"                            # local Mac for now; droplet in S3

[[check]]
name = "first-run check passes on a clean machine"
how = "clone the repo, run ./setup.sh, then ./check.sh, read what it says"
status = "untested"

[[check]]
name = "Takeout import and the cluster bars work on a real watch-history.json"
how = "upload your watch-history.json at /setup; with YOUTUBE_API_KEY the bars show topics, without it channels"
status = "untested"

[[check]]
name = "Connect YouTube writes the private 'Serendip Detour' playlist"
how = "set the OAuth client in .env, open http://localhost:3000/detour on the Mac, press Connect YouTube, Refresh now, then open YouTube on the TV"
status = "untested"

[[check]]
name = "/tv works with a D-pad remote on the Xiaomi Google TV browser"
how = "npm run dev -- -H 0.0.0.0, open http://<mac-ip>:3000/tv?v=a and ?v=b on the TV; zap with the arrows, OK opens actions, Back closes"
status = "untested"

[security]
# The store holds: the taste list (film titles), what you saw or saved, an evening log, a TMDB cache, your
# YouTube watch history from Takeout (video ids, titles, channel names), video metadata, Detour actions, and,
# when you connect YouTube, an encrypted OAuth refresh token. No payment data, no health data, no messages.
# Third-party calls: TMDB, the YouTube Data API and Google OAuth (server); youtube-nocookie.com embeds
# and i.ytimg.com thumbnails (browser).
data = ["account"]
trifecta = []
secrets = "runtime-env"
release = ["leak"]
